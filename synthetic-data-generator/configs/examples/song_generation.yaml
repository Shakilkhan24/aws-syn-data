# Example configuration for song generation

api:
  provider: gemini
  model: gemini-2.5-flash
  keys: ${API_KEYS}

processing:
  batch_size: 50  # Smaller batches for creative tasks
  save_interval: 1
  retry_delay: 0.2  # Slightly longer delay for creative generation
  max_retries: 3

tasks:
  - name: generate_song
    input_column: Song
    output_column: new_song
    prompt_template: |
      নিচে একটি ইংরেজি গান দেওয়া হলো। আপনার কাজ হলো এই গানটির মূল আবেগ, অন্তর্নিহিত বার্তা এবং সৃজনশীল শক্তি থেকে অনুপ্রাণিত হয়ে একটি সম্পূর্ণ নতুন ও মৌলিক বাংলা গান রচনা করা। তবে মনে রাখতে হবে, কোনোভাবেই সরাসরি অনুবাদ বা নকল করা যাবে না। নতুন গানটি স্বতন্ত্র, কাব্যিক এবং আবেগঘন হবে, যেখানে শ্রুতিমধুর ছন্দ, শক্তিশালী শব্দচয়ন এবং গভীর চিত্রকল্প ব্যবহার করা হবে যেন এটি একজন দক্ষ ও অভিজ্ঞ গীতিকারের লেখা মনে হয়। প্রদত্ত গানের তীব্রতা, আবেগ ও সংগ্রামের ভাব বজায় থাকবে, তবে গানের গঠন, প্রকাশভঙ্গি ও শব্দচিত্র সম্পূর্ণ আলাদা হবে। আপনার লেখা এমন একটি সৃষ্টি হতে হবে যা প্রদত্ত গান থেকে অনুপ্রাণিত হলেও নিজস্ব সত্তা ও মৌলিকতায় উজ্জ্বল। কোনো ব্যাখ্যা, মন্তব্য বা অতিরিক্ত লেখা যোগ করা যাবে না; আউটপুট হবে কেবলমাত্র নতুন বাংলা গান।
      
      ইংরেজি গান:
      {input}

